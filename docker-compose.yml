services:
  postgres:
    image: postgres:15-alpine
    container_name: satco_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: satco_admin
      POSTGRES_PASSWORD: Secr3tPassword!
      POSTGRES_DB: satco_furniture_db
    ports:
      - "5432:5432"
    volumes:
      - satco_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: satco_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - satco_redis_data:/data

volumes:
  satco_postgres_data:
  satco_redis_data:
